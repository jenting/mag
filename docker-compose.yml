services:
  nats:
    image: nats:latest
    command: ["--js"]
    ports:
      - "4222:4222"

  redis-primary:
    image: redis:latest
    ports:
      - "6379:6379"

  redis-replica-1:
    image: redis:latest
    ports:
      - "6380:6379"

  redis-replica-2:
    image: redis:latest
    ports:
      - "6381:6379"

  nats-init:
    image: natsio/nats-box:latest
    depends_on:
      - nats
    entrypoint: /bin/sh
    command:
      - -ec
      - |
        until nats --server nats://nats:4222 stream ls >/dev/null 2>&1; do
          sleep 1
        done
        nats --server nats://nats:4222 stream info orders >/dev/null 2>&1 || \
          nats --server nats://nats:4222 stream add orders --subjects orders.created --defaults

  connect-primary:
    image: docker.redpanda.com/redpandadata/connect:latest
    command: ["run", "/connect-primary.yaml"]
    depends_on:
      nats-init:
        condition: service_completed_successfully
      redis-primary:
        condition: service_started
    volumes:
      - ./connect-primary.yaml:/connect-primary.yaml:ro

  connect-replica-1:
    image: docker.redpanda.com/redpandadata/connect:latest
    command: ["run", "/connect-replica-1.yaml"]
    depends_on:
      nats-init:
        condition: service_completed_successfully
      redis-replica-1:
        condition: service_started
    volumes:
      - ./connect-replica-1.yaml:/connect-replica-1.yaml:ro

  connect-replica-2:
    image: docker.redpanda.com/redpandadata/connect:latest
    command: ["run", "/connect-replica-2.yaml"]
    depends_on:
      nats-init:
        condition: service_completed_successfully
      redis-replica-2:
        condition: service_started
    volumes:
      - ./connect-replica-2.yaml:/connect-replica-2.yaml:ro

  nats-cli:
    image: natsio/nats-box:latest
    profiles: ["tools"]
    depends_on:
      - nats
