  redis-replica-14:
    <<: *redis-replica
    ports:
      - "6393:6379"

  redis-replica-15:
    <<: *redis-replica
    ports:
      - "6394:6379"

  redis-replica-16:
    <<: *redis-replica
    ports:
      - "6395:6379"

  redis-replica-17:
    <<: *redis-replica
    ports:
