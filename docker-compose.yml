  redis-replica-19:
    <<: *redis-replica
    ports:
      - "6398:6379"

  redis-replica-20:
    <<: *redis-replica
    ports:
      - "6399:6379"

  nats-init:
    image: natsio/nats-box:latest
    depends_on:
      - nats
    entrypoint: /bin/sh
    command:
      - -ec
      - |
        until nats --server nats://nats:4222 stream ls >/dev/null 2>&1; do
          sleep 1
        done
        nats --server nats://nats:4222 stream info orders >/dev/null 2>&1 || \
          nats --server nats://nats:4222 stream add orders --subjects orders.created --defaults

  connect-publisher:
    image: docker.redpanda.com/redpandadata/connect:latest
    command: ["run", "/connect-publisher.yaml"]
    depends_on:
      nats-init:
        condition: service_completed_successfully
      redis-primary:
        condition: service_started
    volumes:
      - ./connect-publisher.yaml:/connect-publisher.yaml:ro

  connect-replica-1:
    <<: *connect-replica
    environment:
      REDIS_HOST: redis-replica-1
      NATS_DURABLE: redis-replica-1-sink
    depends_on:
      nats-init:
        condition: service_completed_successfully
      redis-replica-1:
        condition: service_started

  connect-replica-2:
