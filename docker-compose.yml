x-redis-replica: &redis-replica
  image: redis:latest

x-connect-replica: &connect-replica
  image: docker.redpanda.com/redpandadata/connect:latest
  command: ["run", "/connect-replica.yaml"]
  volumes:
    - ./connect-replica.yaml:/connect-replica.yaml:ro

services:
  nats:
    image: nats:latest
    command: ["--js"]
    ports:
      - "4222:4222"

  redis-primary:
    image: redis:latest
    ports:
      - "6379:6379"

  redis-replica-1:
    <<: *redis-replica
    ports:
      - "6380:6379"

  redis-replica-2:
    <<: *redis-replica
    ports:
      - "6381:6379"

  redis-replica-3:
    <<: *redis-replica
    ports:
      - "6382:6379"

  redis-replica-4:
    <<: *redis-replica
    ports:
      - "6383:6379"

  redis-replica-5:
    <<: *redis-replica
    ports:
      - "6384:6379"

  redis-replica-6:
    <<: *redis-replica
    ports:
      - "6385:6379"

  redis-replica-7:
    <<: *redis-replica
    ports:
      - "6386:6379"

  redis-replica-8:
    <<: *redis-replica
    ports:
      - "6387:6379"

  redis-replica-9:
    <<: *redis-replica
