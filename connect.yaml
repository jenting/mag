input:
  nats_jetstream:
    urls:
      - nats://nats:4222
    stream: orders
    subject: orders.created
    durable: redis-sink

pipeline:
  processors:
    - mapping: |
        root = if this.key != null && this.key != "" && this.value != null {
          { this.key: this.value }
        } else {
          deleted()
        }

output:
  redis_hash:
    url: tcp://redis:6379
    key: orders-created-kv
    walk_json_object: true
