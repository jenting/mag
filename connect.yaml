input:
  nats_jetstream:
    urls:
      - nats://nats:4222
    stream: orders
    subject: orders.created
    durable: redis-sink

pipeline:
  processors:
    - mapping: |
        root = { this.key: this.value }

output:
  redis_hash:
    url: tcp://redis:6379
    key: orders-created-kv
    walk_json_object: true
